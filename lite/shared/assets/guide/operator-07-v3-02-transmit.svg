<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 14" width="140" height="196" role="img" aria-label="ARGO Operator 07 transmitting" shape-rendering="crispEdges">
  <g id="operator-v3-transmit" transform="translate(0 -1)">
    <!-- one-pixel lift -->
    <rect x="3" y="1" width="4" height="1" fill="#4C1D63"/>
    <rect x="2" y="2" width="6" height="3" fill="#271027"/>
    <rect x="1" y="3" width="2" height="2" fill="#5D2679"/>
    <rect x="6" y="2" width="2" height="3" fill="#E83C98"/>
    <rect x="3" y="3" width="3" height="2" fill="#FFD6EC"/>
    <rect x="4" y="3" width="1" height="1" fill="#FF5A45"/>
    <rect x="7" y="1" width="1" height="1" fill="#FFF1FA"/>

    <!-- body -->
    <rect x="3" y="5" width="4" height="1" fill="#FFF1FA"/>
    <rect x="2" y="6" width="6" height="5" fill="#D52B8A"/>
    <rect x="3" y="6" width="2" height="4" fill="#FF5AA8"/>
    <rect x="2" y="7" width="1" height="3" fill="#76245F"/>
    <rect x="5" y="7" width="2" height="2" fill="#FF5A45"/>
    <rect x="6" y="7" width="1" height="1" fill="#FFF1FA"/>

    <!-- arm and scanner raised beside hood -->
    <rect x="7" y="5" width="1" height="4" fill="#FF5A45"/>
    <rect x="8" y="3" width="2" height="2" fill="#FF5AA8"/>
    <rect x="9" y="2" width="1" height="1" fill="#FFF1FA"/>

    <!-- boots -->
    <rect x="3" y="11" width="2" height="2" fill="#351328"/>
    <rect x="6" y="11" width="2" height="2" fill="#351328"/>
    <rect x="3" y="12" width="1" height="1" fill="#D52B8A"/>
    <rect x="7" y="12" width="1" height="1" fill="#D52B8A"/>
  </g>
</svg>
