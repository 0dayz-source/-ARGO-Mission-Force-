<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>ARGO — TECHNICAL BROADCAST LOOP</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:grid;place-items:center}
  #stage{position:relative;width:800px;height:1280px;background:#000;transform:scale(var(--fit,1));transform-origin:center}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #rec{position:fixed;left:12px;bottom:12px;z-index:9;font:11px ui-monospace,monospace;
       color:#FF2D82;background:#0a0306;border:1px solid #FF2D82;padding:6px 10px;cursor:pointer;opacity:.22}
  #rec:hover{opacity:1}
</style></head><body>
<div id="stage"><canvas id="out"></canvas></div>
<video id="story" src="assets/story.mp4" muted loop autoplay playsinline preload="auto" style="position:absolute;left:-9999px;top:0;width:2px;height:2px;opacity:0.01"></video>
<video id="clip" src="assets/geometric.mp4" muted loop autoplay playsinline preload="auto" style="position:absolute;left:-9999px;top:0;width:2px;height:2px;opacity:0.01"></video>
<button id="rec">● REC 60s</button>
<script>
/* ============================================================================
   ARGO — TECHNICAL BROADCAST LOOP     800×1280 · 60s · seamless

   레퍼런스 두 장에서 가져온 문법
     1) 컨택트 시트 : 같은 프레임을 격자로 반복하고 칸마다 채널을 분리한다.
        칸 위에 작은 모노 라벨(PRO 1205 / OAR-2025 꼴).
     2) 1비트 도면  : 검정 위 흰색만. 디더로 뭉갠 덩어리 + 가는 지시선 +
        번호 노드 + 아주 작고 촘촘한 사양 블록.

   그래서 CRT 는 '전체 톤'이 아니라 장면마다 세기를 조절하는 레이어다.
   도면 장면은 CRT 를 죽이고 디더를 켜서 또렷한 과학 도면으로,
   터미널·컨택트 시트 장면은 CRT 를 올려 브라운관으로 읽히게 한다.

   10 비트 × 평균 6초. 컷은 전부 하드컷 + 1프레임 화이트.
   ========================================================================== */
const W=800, H=1280, DUR=60;
const C={hot:'#FF2D82',rose:'#FF3D68',peach:'#FF9A7A',ice:'#D4FAFF',dust:'#8A5A62',blue:'#5B8DEF',w:'#FFFFFF'};
const MONO='ui-monospace,"SF Mono",Menlo,Consolas,monospace';

/* ---------------------------------------------------------------- 셰이더 */
const VS='attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.,1.);}';
const FS=`precision highp float;
uniform sampler2D uTex; uniform vec2 uRes; uniform float uTime;
uniform float uCrt,uDither,uOff,uSep,uTrans;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float bayer(vec2 a){
  vec2 p=floor(mod(a,4.0)); float i=p.y*4.0+p.x; float m;
  if(i<1.)m=0.;else if(i<2.)m=8.;else if(i<3.)m=2.;else if(i<4.)m=10.;
  else if(i<5.)m=12.;else if(i<6.)m=4.;else if(i<7.)m=14.;else if(i<8.)m=6.;
  else if(i<9.)m=3.;else if(i<10.)m=11.;else if(i<11.)m=1.;else if(i<12.)m=9.;
  else if(i<13.)m=15.;else if(i<14.)m=7.;else if(i<15.)m=13.;else m=5.;
  return (m+0.5)/16.0;
}
void main(){
  vec2 fuv=gl_FragCoord.xy/uRes;
  if(uOff>0.001){ float k=1.0-uOff; fuv.y=(fuv.y-0.5)/max(k*k,0.0012)+0.5; }
  /* 전환은 '오른쪽으로 밀려가는 갤러리' 라 셰이더에서 화면을 굴리지 않는다.
     미끄러지는 동안 가장자리만 살짝 흔들어 필름이 물리적으로 지나가는 느낌만 남긴다. */
  float trBlock = 0.0;
  if(uTrans>0.001){
    float rows = floor(fuv.y*160.0);
    fuv.x += (hash(vec2(rows, floor(uTime*30.0)))-0.5)*0.010*uTrans;
    trBlock = uTrans*0.35;
  }
  /* 곡률 — CRT 세기에 따라 편다 */
  vec2 uv=fuv*2.-1.; vec2 o=uv.yx*uv.yx; uv+=uv*o*vec2(0.075,0.125)*uCrt; uv=uv*.5+.5;
  float t=uTime;
  vec2 inb=step(vec2(0.),uv)*step(uv,vec2(1.)); float inside=inb.x*inb.y;
  vec2 ed=min(uv,1.-uv); inside*=smoothstep(0.,0.014,min(ed.x,ed.y));
  vec2 dir=uv-.5;
  vec2 ao=dir*(.0010+.0075*dot(dir,dir))*(uCrt+uSep*3.0) + vec2(uTrans*0.006,0.0);
  vec3 col;
  col.r=texture2D(uTex,uv+ao).r; col.g=texture2D(uTex,uv).g; col.b=texture2D(uTex,uv-ao).b;
  float s=.0034;
  vec3 wide=texture2D(uTex,uv+vec2(s,0.)).rgb+texture2D(uTex,uv+vec2(-s,0.)).rgb
           +texture2D(uTex,uv+vec2(0.,s)).rgb+texture2D(uTex,uv+vec2(0.,-s)).rgb;
  col+=wide*(0.055+0.075*uCrt);
  /* 1비트 디더 — 레퍼런스 2의 도면 질감 */
  if(uDither>0.001){
    float l=dot(col,vec3(.2126,.7152,.0722));
    float q=step(bayer(gl_FragCoord.xy), clamp(l*1.18,0.,1.));
    col=mix(col,vec3(q),uDither);
  }
  float sl=sin(uv.y*3.14159265*700.0+t*4.);
  col*=mix(1.-0.30*uCrt,1.,sl*sl);
  float gx=gl_FragCoord.x*(6.2831853/3.1);
  col*=mix(vec3(1.),(1.-0.30*uCrt)+0.30*uCrt*cos(gx+vec3(0.,2.094,4.188)),step(.001,uCrt));
  col*=1.0+0.30*uCrt;
  float bar=fract(uv.y*.5-t*.10); bar=smoothstep(0.,.05,bar)*smoothstep(.18,.05,bar);
  col+=bar*0.05*uCrt;
  float vig=smoothstep(.99,.26,length((uv-.5)*vec2(1.02,1.0)));
  col*=mix(1.-0.50*uCrt,1.,vig);
  col*=1.-0.022*uCrt*sin(t*8.);
  col+=(hash(fuv+fract(t*.37))-.5)*(0.018+0.045*uSep+0.10*uTrans);
  col+=trBlock*0.10;
  col=mix(vec3(0.028,0.010,0.020),col,inside);
  gl_FragColor=vec4(col,1.);
}`;

/* ---------------------------------------------------------------- 셋업 */
const out=document.getElementById('out'); out.width=W; out.height=H;
const gl=out.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:true});
const scr=document.createElement('canvas'); scr.width=W; scr.height=H;
const scrG=scr.getContext('2d');
/* 장면 전환을 '오른쪽으로 밀려가는 갤러리' 로 하려면 두 장면을 동시에 그려야 한다.
   장면 페인터는 전부 전역 g 를 쓰므로, 그릴 대상만 갈아 끼운다. */
const bufA=document.createElement('canvas'); bufA.width=W; bufA.height=H;
const bufB=document.createElement('canvas'); bufB.width=W; bufB.height=H;
const ctxA=bufA.getContext('2d'), ctxB=bufB.getContext('2d');
let g=scrG;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const P=gl.createProgram();
gl.attachShader(P,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(P,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(P); gl.useProgram(P);
const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const ap=gl.getAttribLocation(P,'aPos'); gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(P,n);
const tx=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tx);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.uniform1i(U('uTex'),0); gl.viewport(0,0,W,H); gl.uniform2f(U('uRes'),W,H);

/* ---------------------------------------------------------------- 도우미 */
const f=(w,s)=>g.font=`${w} ${s}px ${MONO}`;
const E=t=>t<0?0:t>1?1:t*t*(3-2*t);
const seg=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
function T(txt,x,y,size,col=C.w,weight=600,glow=0,align='left'){
  g.textAlign=align; g.textBaseline='top'; f(weight,size);
  if(glow){g.shadowColor=col;g.shadowBlur=glow;}
  g.fillStyle=col; g.fillText(txt,x,y); g.shadowBlur=0; g.fillText(txt,x,y); g.textAlign='left';
}
function L(x1,y1,x2,y2,col=C.w,w=1,glow=0){
  g.strokeStyle=col; g.lineWidth=w;
  if(glow){g.shadowColor=col;g.shadowBlur=glow;}
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.shadowBlur=0;
}
/* 번호 지시선 — 레퍼런스 2 의 핵심 문법 */
function callout(n,ax,ay,bx,by,label,sub){
  /* [수정] 레퍼런스의 지시선은 머리카락처럼 가늘고 라벨은 아주 작다.
     굵은 선에 큰 라벨을 쓰면 도면이 아니라 인포그래픽으로 읽힌다. */
  g.strokeStyle='rgba(255,255,255,.62)'; g.lineWidth=0.7;
  g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.stroke();
  g.fillStyle=C.w; g.fillRect(ax-1.6,ay-1.6,3.2,3.2);
  const r = bx>ax ? 'left':'right', ox = bx>ax? 6:-6;
  T(String(n),bx+ox,by-12,7.5,'rgba(255,255,255,.55)',400,0,r);
  T(label,bx+ox,by-3,9.2,C.w,600,0,r);
  if(sub) T(sub,bx+ox,by+8,7.4,'rgba(255,255,255,.48)',400,0,r);
}
/* 촘촘한 사양 블록 */
function spec(x,y,rows,size=8.2){
  rows.forEach((r,i)=>T(r,x,y+i*(size+2.2),size,'rgba(255,255,255,.62)',400));
}
/* 회색 덩어리 — 셰이더 디더가 스티플로 바꾼다 */
const mass=(v)=>`rgba(255,255,255,${v})`;

/* ---------------------------------------------------- 기관 도면 꾸밈 요소 */
/* 여백 자·모서리 정합 마크·도면 번호 블록. 실제 엔지니어링 시트의 문법이다. */
function chrome(title,sheet,rev,note,border){
  const m=34;
  /* [수정] 테두리 사각형은 첫 시트(SHEET 01)에만 남긴다 — 매 장면마다 있으면
     같은 액자가 반복돼 답답하다. 여백 좌표와 정합 마크는 그대로 둔다. */
  if(border){
    g.strokeStyle='rgba(255,255,255,.30)'; g.lineWidth=1;
    g.strokeRect(m,m,W-m*2,H-m*2);
    g.strokeRect(m+7,m+7,W-(m+7)*2,H-(m+7)*2);
  }
  /* 여백 좌표 — 세로는 A..H, 가로는 1..6 */
  const rowsN=8, colsN=6;
  for(let i=0;i<rowsN;i++){const y=m+7+(H-(m+7)*2)*(i+0.5)/rowsN;
    T('ABCDEFGH'[i],m+18,y-6,10,'rgba(255,255,255,.42)',600,0,'center');
    T('ABCDEFGH'[i],W-m-18,y-6,10,'rgba(255,255,255,.42)',600,0,'center');
    if(i)L(m,m+7+(H-(m+7)*2)*i/rowsN,m+7,m+7+(H-(m+7)*2)*i/rowsN,'rgba(255,255,255,.3)',1);}
  for(let i=0;i<colsN;i++){const x=m+7+(W-(m+7)*2)*(i+0.5)/colsN;
    T(String(i+1),x,m+16,10,'rgba(255,255,255,.42)',600,0,'center');
    T(String(i+1),x,H-m-26,10,'rgba(255,255,255,.42)',600,0,'center');}
  /* 모서리 정합 마크 */
  for(const [X,Y] of [[m+7,m+7],[W-m-7,m+7],[m+7,H-m-7],[W-m-7,H-m-7]]){
    g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1;
    g.beginPath();g.moveTo(X-9,Y);g.lineTo(X+9,Y);g.moveTo(X,Y-9);g.lineTo(X,Y+9);g.stroke();
    g.beginPath();g.arc(X,Y,5,0,6.2832);g.stroke();}
  /* 표제란 */
  T(title,58,92,17,C.w,600,8);
  T('TERRAFORMING SELECTION COMMITTEE · TFSC-04',58,116,9.5,'rgba(255,255,255,.5)',400);
  T(sheet,W-58,92,12,'rgba(255,255,255,.55)',600,0,'right');
  T('REV '+rev+'   SOL 0687',W-58,110,9.5,'rgba(255,255,255,.42)',400,0,'right');
  L(58,136,W-58,136,'rgba(255,255,255,.38)',1);
  /* 하단 도면 번호 블록 */
  const by=H-116;
  g.strokeStyle='rgba(255,255,255,.38)';g.lineWidth=1;
  g.strokeRect(W-330,by,272,58);
  L(W-330,by+22,W-58,by+22,'rgba(255,255,255,.28)',1);
  L(W-236,by,W-236,by+58,'rgba(255,255,255,.28)',1);
  T('DWG No.',W-324,by+6,8.5,'rgba(255,255,255,.45)',400);
  T('SCALE',W-230,by+6,8.5,'rgba(255,255,255,.45)',400);
  T('ARG-IV-'+sheet.replace(/\D/g,''),W-324,by+30,13,C.w,600);
  T('NTS',W-230,by+30,13,C.w,600);
  if(note) T(note,58,by+40,9,'rgba(255,255,255,.45)',400);
}
/* 단면 해칭 */
function hatch(x,y,w,h,step=7){
  g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip();
  g.strokeStyle='rgba(255,255,255,.40)'; g.lineWidth=1;
  for(let i=-h;i<w+h;i+=step){g.beginPath();g.moveTo(x+i,y+h);g.lineTo(x+i+h,y);g.stroke();}
  g.restore();
}
/* 공차·치수 */
function dim(x1,x2,y,label){
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1;
  g.beginPath();g.moveTo(x1,y);g.lineTo(x2,y);
  g.moveTo(x1,y-6);g.lineTo(x1,y+6);g.moveTo(x2,y-6);g.lineTo(x2,y+6);g.stroke();
  T(label,(x1+x2)/2,y+7,9.5,'rgba(255,255,255,.62)',400,0,'center');
}


/* ---- 대시보드 패널 (레퍼런스 12·13) ---------------------------------
   // 제목  ·  번호 붙은 공정 목록  ·  체크박스 레이어 목록  ·  판독 수치 열 */
function panel(x,y,w,h,title,right){
  g.strokeStyle='rgba(255,255,255,.42)'; g.lineWidth=1; g.strokeRect(x,y,w,h);
  g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(x,y,w,16);
  L(x,y+16,x+w,y+16,'rgba(255,255,255,.42)',1);
  T('// '+title,x+6,y+4,8.4,'rgba(255,255,255,.85)',600);
  if(right) T(right,x+w-6,y+4,8.4,'rgba(255,255,255,.55)',400,0,'right');
}
function stepList(x,y,items,k){
  items.forEach((it,i)=>{
    const on = i < Math.floor(items.length*k)+1;
    T(String(i+1).padStart(2,'0'),x,y+i*13,8,on?'#fff':'rgba(255,255,255,.30)',600);
    T(it,x+20,y+i*13,8,on?'rgba(255,255,255,.82)':'rgba(255,255,255,.26)',400);
    if(on) L(x+w0(items)+24,y+i*13+4,x+w0(items)+34,y+i*13+4,'#fff',1);
  });
}
function w0(items){ return Math.max(...items.map(s=>s.length))*4.6; }
function layerList(x,y,items,t){
  items.forEach((it,i)=>{
    const on=(Math.floor(t*0.6)+i)%3!==0;
    g.strokeStyle='rgba(255,255,255,.6)'; g.lineWidth=1; g.strokeRect(x,y+i*13,6,6);
    if(on){ g.fillStyle='#fff'; g.fillRect(x+1.5,y+i*13+1.5,3,3); }
    T(it,x+12,y+i*13-1,8,on?'rgba(255,255,255,.85)':'rgba(255,255,255,.34)',400);
  });
}
function readout(x,y,rows){
  rows.forEach(([k,v],i)=>{
    T(k,x,y+i*13,7.6,'rgba(255,255,255,.45)',400);
    T(v,x+96,y+i*13,7.6,'#fff',600,0,'right');
  });
}
/* 작은 파형 그래프 — 레퍼런스 13 하단 */
function wave(x,y,w,h,t,seed,kind){
  g.strokeStyle='rgba(255,255,255,.30)'; g.lineWidth=1; g.strokeRect(x,y,w,h);
  g.strokeStyle='#fff'; g.lineWidth=1.2; g.beginPath();
  for(let i=0;i<=w;i+=2){
    const u=i/w, ph=u*18+t*1.6+seed;
    let v;
    if(kind===0) v=Math.sin(ph)*0.5+Math.sin(ph*2.7)*0.22;
    else if(kind===1) v=((ph/3)%2<1?1:-1)*0.5;
    else v=(((ph/2)%2)-1)*0.62;
    const Y=y+h/2-v*h*0.40; i?g.lineTo(x+i,Y):g.moveTo(x+i,Y);
  }
  g.stroke();
  L(x,y+h/2,x+w,y+h/2,'rgba(255,255,255,.18)',1);
}

/* ------------------------------------------------------------ 트래킹 HUD */
/* 대상에 달라붙는 모서리 괄호 + 상태 라벨. 레퍼런스의 '트래킹 기법'. */
function track(x,y,w,h,label,state,col=C.w,phase=0){
  const c=Math.min(w,h)*0.26;
  g.strokeStyle=col; g.lineWidth=1.6; g.shadowColor=col; g.shadowBlur=8;
  for(const [sx,sy,ox,oy] of [[1,1,x,y],[-1,1,x+w,y],[1,-1,x,y+h],[-1,-1,x+w,y+h]]){
    g.beginPath();g.moveTo(ox,oy);g.lineTo(ox+c*sx,oy);g.moveTo(ox,oy);g.lineTo(ox,oy+c*sy);g.stroke();}
  g.shadowBlur=0;
  /* 회전하는 조준 링 */
  const cx=x+w/2, cy=y+h/2, r=Math.min(w,h)*0.14;
  g.strokeStyle=col; g.lineWidth=1;
  for(let k=0;k<4;k++){const a=phase+k*1.5708;
    g.beginPath();g.arc(cx,cy,r,a+0.18,a+1.39);g.stroke();}
  L(cx-r*1.7,cy,cx-r*0.5,cy,col,1); L(cx+r*0.5,cy,cx+r*1.7,cy,col,1);
  L(cx,cy-r*1.7,cx,cy-r*0.5,col,1); L(cx,cy+r*0.5,cx,cy+r*1.7,col,1);
  T(label,x,y-14,10.5,col,600,5);
  T(state,x+w,y-14,10.5,col,600,5,'right');
}


/* =====================================================================
   레퍼런스 문법 — 숫자 글리프 필드 · 커서 산포 · 데이터 태그 · 찢김 밴드
   ===================================================================== */

/* ---- 숫자·기호 글리프 필드 (레퍼런스 3) -----------------------------
   화면 전체를 숫자와 수학 기호로 덮는다. 매 프레임 5천 자를 찍으면 무거우니
   전용 오프스크린에 그려 두고 0.22초마다만 다시 굽는다. */
const GLYPHS='0123456789ω∞⊢⊣⌐⊔↦⊥⊤⌙⌐¬∟';
const gfBuf=document.createElement('canvas'), gfCtx=gfBuf.getContext('2d');
let gfAt=-1;
function glyphField(t,cell=15,alpha=0.42){
  const key=Math.floor(t*4.5);
  if(gfAt!==key){

    ascCtx.setTransform(1,0,0,1,0,0); ascCtx.fillStyle='#000'; ascCtx.fillRect(0,0,cols,rows);

    readout(70,H-260,[['SOL','0687'],['EXPOSURE','1/48 s'],['GAIN','+6 dB'],
                      ['SPECTRUM','420-680 nm'],['FRAME','04 / 04']]);
    panel(292,H-282,214,120,'LAYERS','05');
    layerList(304,H-256,['PARTICLE FIELD','CORE BLOOM','ASCII READ','TRACK MARKS','GRID'],t);
    panel(526,H-282,216,120,'SIGNAL','3 CH');
    wave(538,H-256,190,26,t,0,0); wave(538,H-222,190,26,t,1.7,1); wave(538,H-188,190,26,t,3.1,2);
    g.globalAlpha=1; }
  /* 표제는 아주 작게 한 줄만 — 큰 글씨는 걷어냈다 */
  const o1=E(seg(t,3.6,4.8)); g.globalAlpha=o1;

  T('SOL 0687',W-58,H-128,9.5,'rgba(255,255,255,.55)',400,0,'right');

}

/* ---------------------------------------------------------------- 타임라인 */
/* 여섯 장면 × 10초. 페이지가 많아 1분 안에 이동이 잦다는 지적에 따라
   SECTION A-A · 육각 매트릭스 · 마지막 성운 장면을 걷어냈다.
   [start, painter, crt세기, dither세기, 채널분리] */
const BEATS=[
  [0.0 , s01, 1.00, 0.00, 0.00],   /* BOOT            */
  [10.0, s02, 0.30, 0.00, 0.00],   /* SIGNAL PLATE    영상 0.5배 */
  [20.0, s03, 0.22, 1.00, 0.00],   /* TRANSFER GEOM   */
  [30.0, s04, 0.30, 0.00, 0.00],   /* ARCHIVE PLATE   영상 */
  [40.0, s07, 0.22, 1.00, 0.00],   /* ENTRY DESCENT   */
  [50.0, s09, 0.26, 1.00, 0.00],   /* HORIZON         */
];
/* 전환 : 미끄러지는 대신 그냥 위에 덮어씌운다.
   장면마다 CRT 곡률이 달라 밀어 넣으면 곡면이 펴지는 게 보였다.
   겹쳐 넘기면 기하가 움직이지 않으므로 그 어색함이 사라진다.
   CRT·디더 세기도 두 장면 사이를 선형으로 건너간다 — 안 그러면 질감이 툭 바뀐다. */
const TR=0.9;
function slideAt(t){
  for(let i=1;i<BEATS.length;i++){
    const bt=BEATS[i][0], d=t-bt;
    if(d>=0 && d<=TR){ const u=d/TR; return {from:i-1,to:i,p:u*u*(3-2*u)}; }
  }
  let i=0; for(let k=0;k<BEATS.length;k++) if(t>=BEATS[k][0]) i=k;
  return {from:i,to:i,p:1};
}
function offAmount(t){
  if(t>DUR-0.55) return E((t-(DUR-0.55))/0.55);
  if(t<0.40)     return 1-E(t/0.40);
  return 0;
}
const mix=(a,b,k)=>a+(b-a)*k;
let t0=performance.now(), forced=null;
function frame(now){
  const t = forced!=null ? forced : ((now-t0)/1000)%DUR;
  const sl = slideAt(t);
  const A=BEATS[sl.from], B=BEATS[sl.to];
  if(sl.from===sl.to){
    g=scrG; B[1](t-B[0]);
  }else{
    g=ctxA; A[1](t-A[0]);
    g=ctxB; B[1](Math.max(0,t-B[0]));
    g=scrG; g.setTransform(1,0,0,1,0,0);
    g.globalAlpha=1; g.drawImage(bufA,0,0);
    g.globalAlpha=sl.p; g.drawImage(bufB,0,0); g.globalAlpha=1;
  }
  gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,scr);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.uniform1f(U('uTime'),t);
  gl.uniform1f(U('uCrt'),    mix(A[2],B[2],sl.p));
  gl.uniform1f(U('uDither'), mix(A[3],B[3],sl.p));
  gl.uniform1f(U('uSep'),    mix(A[4],B[4],sl.p));
  gl.uniform1f(U('uTrans'),0);
  gl.uniform1f(U('uOff'),offAmount(t));
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__argoSeek=s=>{forced=s;}; window.__argoPlay=()=>{forced=null;t0=performance.now();};

function fit(){document.getElementById('stage').style.setProperty('--fit',Math.min(1,Math.min(innerWidth/W,innerHeight/H)));}
fit(); addEventListener('resize',fit);

document.getElementById('rec').onclick=function(){
  const btn=this;
  const types=['video/mp4;codecs=avc1.640034','video/mp4','video/webm;codecs=vp9','video/webm'];
  const mime=types.find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime){btn.textContent='NOT SUPPORTED';return;}
  const chunks=[], rec=new MediaRecorder(out.captureStream(60),{mimeType:mime,videoBitsPerSecond:16e6});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{const blob=new Blob(chunks,{type:mime}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='argo-crt-loop.'+(mime.includes('mp4')?'mp4':'webm');
    a.click(); btn.textContent='● REC 60s';};
  window.__argoPlay(); rec.start(); btn.textContent='RECORDING…';
  setTimeout(()=>rec.stop(),DUR*1000);
};
